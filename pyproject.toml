[project]
name = "research-wiki"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "fastembed>=0.8.0",
    "leidenalg>=0.11.0",
    "python-igraph>=1.0.0",
    "pyyaml>=6.0",
    "scipy>=1.17.1",
    "transformers>=4.51",
    "watchdog>=4.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "apps/vault-ui"]

[tool.ruff]
line-length = 100
target-version = "py311"

[dependency-groups]
dev = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pytest>=9.0.3",
    "uvicorn[standard]>=0.32",
]
