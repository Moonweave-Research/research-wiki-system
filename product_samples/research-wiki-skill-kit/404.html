<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>페이지를 찾을 수 없습니다</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f6f8fb;
      color: #161719;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }
    main {
      width: min(520px, calc(100vw - 40px));
      border: 1px solid #dbe3ee;
      border-radius: 12px;
      background: #fff;
      padding: 28px;
    }
    h1 { margin: 0 0 10px; font-size: 26px; }
    p { margin: 0 0 22px; color: #72757d; line-height: 1.6; }
    a {
      display: inline-flex;
      padding: 11px 14px;
      border-radius: 8px;
      background: #161719;
      color: #fff;
      text-decoration: none;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <main>
    <h1>페이지를 찾을 수 없습니다.</h1>
    <p>프롬프트 키트 메인 페이지로 돌아가 주세요.</p>
    <a href="./">메인으로</a>
  </main>
</body>
</html>
